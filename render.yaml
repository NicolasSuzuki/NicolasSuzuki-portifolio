services:
  - type: web
    name: NicolasSuzuki-portifolio
    runtime: static
    repo: https://github.com/NicolasSuzuki/NicolasSuzuki-portifolio
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
